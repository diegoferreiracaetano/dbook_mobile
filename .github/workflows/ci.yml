name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-format-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Activate melos
        run: dart pub global activate melos

      - name: Add pub cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Analyze
        run: melos run analyze

      - name: Check formatting
        run: melos run format

      - name: Test with coverage (Dart-only packages)
        run: melos run coverage:dart

      - name: Test with coverage (Flutter packages)
        run: melos run coverage

      - name: Combine coverage
        run: ./tool/combine_coverage.sh

      - name: Check coverage minimum
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 80

  build-android:
    needs: analyze-format-test
    runs-on: ubuntu-latest
    # `secrets` não existe no `if` de um passo (o GitHub recusa o workflow
    # inteiro), então o secret vai pro `env` do job e o `if` testa o `env`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Build debug APK
        working-directory: apps/dbook_mobile
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dbook_mobile-debug-apk
          path: apps/dbook_mobile/build/app/outputs/flutter-apk/app-debug.apk

      # Sem os secrets abaixo (repo ainda não tem um keystore de release
      # configurado), o build.gradle.kts cai pra assinatura de debug
      # sozinho — o release builda igual, só não sai pronto pra publicar.
      - name: Set up release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/dbook_mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > key.properties

      - name: Build release APK
        working-directory: apps/dbook_mobile
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dbook_mobile-release-apk
          path: apps/dbook_mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: analyze-format-test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bootstrap workspace
        run: flutter pub get

      # Sem certificado/perfil de provisionamento da Apple Developer
      # Program configurado neste repo, não dá pra gerar um .ipa assinado
      # de verdade — isso só valida que o app compila e arquiva pra iOS.
      - name: Build (no codesign)
        working-directory: apps/dbook_mobile
        run: flutter build ios --release --no-codesign

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dbook_mobile-ios-build
          path: apps/dbook_mobile/build/ios/iphoneos/Runner.app

  # --- Portal administrativo (Flutter Web) -----------------------------------
  # Guardas de segurança do código, build de verdade, orçamento de tamanho e de
  # tempo até interativo. Os testes do portal já rodam em `analyze-format-test`
  # (o melos pega todo pacote com pasta test/).
  build-portal:
    needs: analyze-format-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Guardas de segurança do código do portal
        run: ./tool/check_portal_source.sh

      # `--no-web-resources-cdn`: o CanvasKit sai junto do bundle, e a CSP do
      # portal (docs/portal-seguranca.md) não precisa liberar o gstatic.
      - name: Build do portal
        working-directory: apps/dbook_admin
        run: flutter build web --release --no-web-resources-cdn --dart-define=APP_ENV=ci

      - name: Orçamento de tamanho do bundle
        run: ./tool/check_bundle_size.sh apps/dbook_admin/build/web 1500

      - name: Tempo até interativo (Lighthouse)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/dbook_admin/deploy/lighthouserc.json
          uploadArtifacts: true

      - name: Guardar o build do portal
        uses: actions/upload-artifact@v4
        with:
          name: dbook_admin-web
          path: apps/dbook_admin/build/web

  # Vulnerabilidades conhecidas nas dependências do `pubspec.lock`.
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Auditar pubspec.lock
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock
