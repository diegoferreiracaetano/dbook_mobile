<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Filtros do hotel</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="dbook.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="appbar"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Hotéis em Rio de Janeiro</span></div>
  <div class="body" style="opacity:.5">
    <div class="card" style="overflow:hidden"><div class="photo hotel" style="height:120px"></div><div style="padding:12px"><b>Hotel Rio de Janeiro Centro</b></div></div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="row"><span class="h2">Filtros</span><span class="sp"></span><span style="color:var(--primary);font-weight:500">Limpar</span></div>
    <div>
      <div class="label">Estrelas</div>
      <div class="row" style="gap:8px;margin-top:8px"><span class="chip">Todas</span><span class="chip">3★+</span><span class="chip on">4★+</span><span class="chip">5★</span></div>
    </div>
    <div>
      <div class="label">Faixa de preço (total da estadia)</div>
      <div style="margin-top:10px">
        <div style="height:6px;border-radius:3px;background:var(--line);position:relative"><div style="position:absolute;left:12%;right:30%;top:0;bottom:0;background:var(--primary);border-radius:3px"></div><span style="position:absolute;left:12%;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--primary)"></span><span style="position:absolute;right:30%;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--primary)"></span></div>
        <div class="row" style="margin-top:14px"><div class="field" style="flex:1"><div><small>Mínimo</small><b>$400</b></div></div><div class="field" style="flex:1"><div><small>Máximo</small><b>$1.200</b></div></div></div>
      </div>
    </div>
    <div>
      <div class="label">Ordenar</div>
      <div class="row" style="gap:8px;margin-top:8px"><span class="chip on">Menor preço</span><span class="chip">Melhor avaliados</span></div>
    </div>
    <div class="row" style="gap:12px"><button class="btn out" style="flex:1">Redefinir</button><button class="btn" style="flex:1">Ver 7 hotéis</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
