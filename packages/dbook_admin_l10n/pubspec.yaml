version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dbook_admin_data:
