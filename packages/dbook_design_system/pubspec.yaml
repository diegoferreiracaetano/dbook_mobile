name: dbook_design_system
description: "Design system do DBook Mobile: tokens, tema e componentes compartilhados."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Roboto vai junto com o pacote (cópia da que o SDK do Flutter já traz,
  # Apache 2.0): o portal roda sob CSP `font-src 'self'` e o app não deve
  # depender de um CDN para desenhar texto. Só os pesos reais da família.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
