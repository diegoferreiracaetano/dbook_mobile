name: dbook_mobile_workspace
publish_to: none

environment:
  sdk: ^3.13.3

dev_dependencies:
  melos: ^8.7.0

workspace:
  - apps/dbook_mobile
  - packages/dbook_design_system
  - packages/dbook_design_system/sample
  - packages/dbook_design_system/widgetbook
  - packages/dbook_domain
  - packages/dbook_core_network
  - packages/dbook_core_storage
  - packages/dbook_core_session
  - packages/dbook_feature_auth
  - packages/dbook_feature_flights
  - packages/dbook_feature_booking
  - packages/dbook_feature_realtime
  - packages/dbook_feature_ai
  - packages/dbook_feature_notifications
  - packages/dbook_feature_stays
  - packages/dbook_admin_data
  - packages/dbook_admin_l10n
  - packages/dbook_admin_session
  - packages/dbook_feature_admin_auth
  - packages/dbook_feature_admin_team
  - packages/dbook_feature_admin_customers
  - packages/dbook_feature_admin_bookings
  - packages/dbook_feature_admin_catalog
  - packages/dbook_feature_admin_dashboard
  - packages/dbook_feature_admin_governance
  - apps/dbook_admin

melos:
  name: dbook_mobile

  scripts:
    analyze:
      run: melos exec -- flutter analyze
      description: Roda flutter analyze em todos os pacotes

    format:
      run: melos exec -- dart format --set-exit-if-changed .
      description: Verifica formatação em todos os pacotes

    test:
      run: melos exec --dir-exists=test --flutter -- flutter test
      description: Roda os testes dos pacotes Flutter que têm pasta test/

    test:dart:
      run: melos exec --dir-exists=test --no-flutter -- dart test
      description: Roda os testes dos pacotes Dart puro (sem Flutter) que têm pasta test/

    coverage:
      run: melos exec --dir-exists=test --flutter -- flutter test --coverage
      description: Roda os testes Flutter com cobertura (gera coverage/lcov.info em cada pacote)

    coverage:dart:
      run: melos exec --dir-exists=test --no-flutter -- bash $MELOS_ROOT_PATH/tool/dart_test_coverage.sh
      description: Roda os testes Dart puro com cobertura (gera coverage/lcov.info em cada pacote)
