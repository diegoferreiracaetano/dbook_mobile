name: dbook_mobile_workspace
publish_to: none

environment:
  sdk: ^3.13.3

dev_dependencies:
  melos: ^8.7.0

workspace:
  - apps/dbook_mobile
  - packages/dbook_design_system
  - packages/dbook_design_system/sample
  - packages/dbook_design_system/widgetbook
  - packages/dbook_domain

melos:
  name: dbook_mobile

  scripts:
    analyze:
      run: melos exec -- flutter analyze
      description: Roda flutter analyze em todos os pacotes

    format:
      run: melos exec -- dart format --set-exit-if-changed .
      description: Verifica formatação em todos os pacotes

    test:
      run: melos exec --dir-exists=test --flutter -- flutter test
      description: Roda os testes dos pacotes Flutter que têm pasta test/

    test:dart:
      run: melos exec --dir-exists=test --no-flutter -- dart test
      description: Roda os testes dos pacotes Dart puro (sem Flutter) que têm pasta test/

    coverage:
      run: melos exec --dir-exists=test -- flutter test --coverage
      description: Roda os testes com cobertura (gera coverage/lcov.info em cada pacote)
